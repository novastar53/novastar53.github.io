name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Notebooks are frozen (no-execute), so the build only needs the
      # docs toolchain — not the full jax/torch/tf stack, the local jaxpt
      # wheel, or manim (no notebook uses the manim-slides directive).
      # jupyter-book is pinned to the local uv.lock version: the 2.x CLI
      # silently no-ops on this build command.
      - name: Install build dependencies
        run: |
          pip install "jupyter-book==1.0.4.post1" sphinxext-opengraph \
                      sphinx-sitemap sphinx-comments ghp-import

      - name: Generate sidebar
        run: python generate_sidebar.py

      - name: Generate landing page
        run: python generate_landing.py

      - name: Build site
        run: jupyter-book build site/

      # Mirror the post-build steps in the Makefile
      - name: Copy static assets
        run: |
          cp -r site/_static/* site/_build/html/_static/
          cp -r site/_images/* site/_build/html/_images/ 2>/dev/null || true
          cp -r site/media site/_build/html/
          cp CNAME site/_build/html/

      - name: Generate feed and annotations
        run: |
          python generate_rss.py site/_build/html https://blog.vikrampawar.com
          python annotate_posts.py site/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/_build/html
          publish_branch: gh-pages
